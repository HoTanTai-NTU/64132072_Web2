<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title></title>
    <style>
        .dauTrang {
            background: url('/TongHopGK/src/main/resources/templates/images/header.jpeg') no-repeat center center;
            background-size: cover;
            height: 200px;
        }
        .hinhBen {
            background: url('/TongHopGK/src/main/resources/templates/images/sidebar.jpg') no-repeat center center;
            background-size: cover;
            width: 30%;
            height: 100%;
        }
        .chanTrang {
            text-align: center;
            padding: 15px;
            background: #f4f4f4;
        }
        .menu {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 0;
            background: #f4f4f4;
        }
        .menu a {
            text-decoration: none;
            font-weight: bold;
            color: black;
            padding: 10px 20px;
            transition: 0.3s;
        }
        .menu a:hover {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div th:fragment="dauTrang" class="dauTrang"></div>

<div th:fragment="danhMuc">
    <nav class="menu">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/about}">About</a>
        <a th:href="@{/studentlist}">List</a>
        <a th:href="@{/add}">Add New</a>
    </nav>
</div>

<div th:fragment="hinhBen" class="hinhBen"></div>

<div th:fragment="chanTrang">
    <p>© Copyrighted by Hồ Tấn Tài</p>
</div>

</body>
</html>
