<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        .container {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 60px 1fr 40px;
            height: 100vh;
        }
        .header {
            grid-column: 1 / 3;
            background-color: #4a90e2;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 18px;
        }
        .header-logo img {
            height: 40px;
        }
        .sidebar {
            background-color: #eef1f5;
            padding: 20px;
        }
        .sidebar a {
            display: block;
            color: #333;
            text-decoration: none;
            margin-bottom: 10px;
            font-weight: bold;
            border: 1px solid #ccc;
            padding: 8px 12px;
            border-radius: 4px;
            background-color: #fff;
            transition: background-color 0.2s ease;
        }
        .sidebar a:hover {
            background-color: #e0e0e0;
        }
        .sidebar a:first-child {
            font-weight: 900; /* Make "Dashboard" extra bold */
        }
        .content {
            padding: 30px;
        }
        .footer {
            grid-column: 1 / 3;
            background-color: #eee;
            text-align: center;
            padding: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-logo">
            <img src="https://khoacntt.ntu.edu.vn/Portals/54/Logo-Khoa-CNTT-NTU.png?ver=w1WaDt4_a6t2zoyh_JwxVA%3D%3D" alt="FIT.NTU Logo">
        </div>
        <div>[Hồ Tấn Tài]</div>
    </div>
    <div class="sidebar">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/dashboard/topic/all}">Topic - List</a>
        <a th:href="@{/dashboard/topic/new}">Topic - Addnew</a>
        <a th:href="@{/student/list}">Student - List</a>
        <a th:href="@{/student/new}">Student -Addnew</a>
    </div>
    <div class="content">
        <h2>Content</h2>
    </div>
    <div class="footer">
        ©2025 by Student Name – FIT.NTU
    </div>
</div>
</body>
</html>
